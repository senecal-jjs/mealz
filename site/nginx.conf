server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # nginx drops server-level add_header lines inside a location that sets its own, so each
  # location lists all of its headers.

  # File names under /_astro/ change whenever their content does, so they can be cached for good.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}

# One address for the site: www.mealz.menu sends visitors to mealz.menu. Fly ends TLS
# before nginx, so the redirect names https itself.
server {
  listen 8080;
  server_name www.mealz.menu;
  return 301 https://mealz.menu$request_uri;
}
