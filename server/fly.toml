# Deploy with `fly deploy` from this folder. See README.md for first-time setup.
app = "mealz-scan"
primary_region = "iad"
# Litestream passes the stop signal on to the server, then sends its last
# changes to the backup bucket before exiting; give it time to do both.
kill_signal = "SIGINT"
kill_timeout = "30s"

[env]
  PORT = "8080"
  DB_PATH = "/data/scans.db"
  MODEL = "claude-opus-5-5"
  EFFORT = "low"
  DAILY_LIMIT_PER_INSTALL = "30"
  DAILY_LIMIT_TOTAL = "2000"
  # Claude API credentials come from workload identity federation; the IDs are
  # Fly secrets (see README.md). FLY_OIDC_AUDIENCE defaults to https://api.anthropic.com.
  # App Attest is on when APPLE_APP_ID ("<Team ID>.com.bitcli.mealz") is set.
  # Only signed scans are served; "false" also serves unsigned ones.
  ATTEST_REQUIRED = "true"
  # Scan credit (see README.md). 0 turns it off and every scan is free.
  SCAN_PRICE_CENTS = "10"
  FREE_SCANS_PER_MONTH = "3"
  # APPLE_APP_STORE_ID: the app's numeric ID in App Store Connect, needed to
  # check production purchases. Sandbox and TestFlight purchases work without it.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Scan counts, attested keys and the credit ledger live in SQLite on this
# volume, so run a single machine. Litestream backs the file up to Tigris.
[mounts]
  source = "scan_data"
  destination = "/data"

# Litestream's metrics, for Fly's managed Grafana (replication lag, errors).
[metrics]
  port = 9090
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  # Room for Litestream and several 10 MB scans at once.
  memory = "512mb"
